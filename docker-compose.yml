services:
  cratedb:
    image: crate:latest
    container_name: cratedb

    ports:
      - '4200:4200'
      - '5432:5432'

    command: >
      crate
      -Ccluster.name=smart-grid
      -Cnode.name=node1
      -Cauth.host_based.enabled=false

    volumes:
      - cratedb_data:/data

  emqx:
    image: emqx/emqx:latest
    container_name: emqx

    ports:
      - '1883:1883'
      - '18083:18083'

    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

    healthcheck:
      test: ['CMD', '/opt/emqx/bin/emqx_ctl', 'status']
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: backend

    ports:
      - '8000:8000'

    environment:
      CRATE_URL: http://cratedb:4200
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      # EMQX rule is the canonical CrateDB writer. Keep this disabled to avoid
      # duplicate telemetry rows while the backend consumes the same topic.
      PERSIST_MQTT_TELEMETRY: 'false'
      TELEMETRY_RETENTION_DAYS: 7
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173

    depends_on:
      - cratedb
      - emqx

  frontend:
    build: ./frontend
    container_name: frontend

    ports:
      - '5173:5173'

    depends_on:
      - backend

  locust:
    build:
      context: .
      dockerfile: locust-simulator/Dockerfile

    container_name: locust

    depends_on:
      - emqx

    ports:
      - '8089:8089'

volumes:
  cratedb_data:
  emqx_data:
  emqx_log:
